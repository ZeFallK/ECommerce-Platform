apiVersion: v1
kind: Service
metadata:
  name: otel-collector
  labels:
    {{- include "observability.labels" (dict "root" . "component" "otel-collector") | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "observability.selectorLabels" (dict "root" . "component" "otel-collector") | nindent 4 }}
  ports:
    - name: grpc
      port: 4317
      targetPort: grpc
    - name: http
      port: 4318
      targetPort: http
    - name: metrics
      port: 8889
      targetPort: metrics
---
