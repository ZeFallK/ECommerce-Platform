{{- if .Values.topicJob.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "kafka.fullname" . }}-topics
  labels:
    {{- include "kafka.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "5"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: {{ .Values.topicJob.backoffLimit }}
  template:
    metadata:
      labels:
        {{- include "kafka.selectorLabels" . | nindent 8 }}
    spec:
      restartPolicy: OnFailure
      containers:
        - name: create-topics
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - /bin/sh
            - -ec
          args:
            - |
              until /opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server {{ include "kafka.fullname" . }}:{{ .Values.service.port }} >/dev/null 2>&1; do
                sleep 2
              done
              {{- range .Values.topics }}
              /opt/kafka/bin/kafka-topics.sh --bootstrap-server {{ include "kafka.fullname" $ }}:{{ $.Values.service.port }} --create --if-not-exists --topic {{ . | quote }} --partitions 1 --replication-factor 1
              {{- end }}
{{- end }}
