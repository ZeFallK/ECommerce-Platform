fullnameOverride: frontend

global:
  imageRegistry: ""

image:
  repository: frontend
  tag: latest
  pullPolicy: IfNotPresent

replicaCount: 1

service:
  type: ClusterIP
  port: 5173
  targetPort: http

ingress:
  enabled: true
  path: /
  pathType: Prefix
  host: ""
  annotations: {}

serviceAccount:
  create: true
  name: ""
  automountToken: false

podSecurityContext:
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL

probes:
  readiness:
    enabled: true
    path: /
    initialDelaySeconds: 10
    periodSeconds: 10
  liveness:
    enabled: true
    path: /
    initialDelaySeconds: 30
    periodSeconds: 20

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

env: []
envFrom: []
