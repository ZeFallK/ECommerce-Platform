fullnameOverride: orders

global:
  imageRegistry: ""
  kafka:
    bootstrapServers: "kafka:9092"
  otel:
    endpoint: "http://otel-collector:4317"

image:
  repository: orders
  tag: latest
  pullPolicy: IfNotPresent

replicaCount: 1

service:
  type: ClusterIP
  port: 8000
  targetPort: http

ingress:
  enabled: true
  path: /api/orders
  pathType: Prefix
  host: ""
  annotations: {}

serviceAccount:
  create: true
  name: ""
  automountToken: false

podSecurityContext:
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL

probes:
  readiness:
    enabled: true
    path: /health
    initialDelaySeconds: 10
    periodSeconds: 10
  liveness:
    enabled: true
    path: /health
    initialDelaySeconds: 30
    periodSeconds: 20

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

env: []
envFrom: []
